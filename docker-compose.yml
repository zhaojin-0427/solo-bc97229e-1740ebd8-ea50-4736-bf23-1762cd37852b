services:
  papersite:
    build: ./papersite
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/papers/p0.html').read()"]
      interval: 2s
      timeout: 3s
      retries: 15

  crawler:
    build:
      context: ./crawler
      target: runtime
    environment:
      DATABASE_PATH: /data/crawler.db
    volumes:
      - crawler_data:/data        # crawl state survives restarts
    ports:
      - "8000:8000"               # interactive API docs: http://localhost:8000/docs
    depends_on:
      papersite:
        condition: service_healthy

  # one-shot regression suite: docker compose run --rm tests
  tests:
    build:
      context: ./crawler
      target: test
    volumes:
      - ./papersite:/papersite:ro
    environment:
      DATABASE_PATH: /tmp/test.db
    profiles: ["test"]

volumes:
  crawler_data:
